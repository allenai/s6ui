name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Verify version
        run: ./target/release/s6ui --version

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libx11-xcb-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxkbcommon-dev libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Verify version
        run: ./target/release/s6ui --version

  release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Verify tag matches Cargo.toml
        run: |
          VERSION_TOML=$(sed -nE 's/^version = "([^"]+)"/v\1/p' Cargo.toml | head -1)
          TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Cargo.toml: $VERSION_TOML"
          echo "git tag:   $TAG_VERSION"
          if [ "$VERSION_TOML" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Cargo.toml says $VERSION_TOML but tag is $TAG_VERSION"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Compute source tarball sha256
        id: sha
        run: |
          TAG="${{ steps.get_version.outputs.VERSION }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sL "$URL" | shasum -a 256 | awk '{print $1}')
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA"

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.VERSION }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          URL="${{ steps.sha.outputs.url }}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/allenai/homebrew-s6ui.git" homebrew-tap
          cd homebrew-tap

          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/s6ui.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/s6ui.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/s6ui.rb
          git commit -m "Update s6ui to ${TAG}"
          git push
