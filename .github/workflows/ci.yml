name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify version
        run: ./target/release/s6ui --version

  homebrew-smoke-test:
    runs-on: macos-latest
    needs: [build-macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build vendored Homebrew source bundle
        run: ./scripts/build-homebrew-source-bundle.sh --output /tmp/s6ui-homebrew.tar.gz

      - name: Render Homebrew formula
        run: |
          SHA=$(shasum -a 256 /tmp/s6ui-homebrew.tar.gz | awk '{print $1}')
          ./scripts/render-homebrew-formula.sh \
            --url "file:///tmp/s6ui-homebrew.tar.gz" \
            --sha256 "$SHA" \
            --output /tmp/s6ui.rb

      - name: Install with Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install --build-from-source /tmp/s6ui.rb

      - name: Validate Homebrew install
        run: brew test s6ui

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libegl1-mesa-dev \
            libssl-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify version
        run: ./target/release/s6ui --version

  release:
    runs-on: ubuntu-latest
    needs: [build-macos, homebrew-smoke-test, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Verify tag matches Cargo.toml
        run: |
          VERSION_TOML=$(sed -nE 's/^version = "([^"]+)"/v\1/p' Cargo.toml | head -1)
          TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Cargo.toml: $VERSION_TOML"
          echo "git tag:   $TAG_VERSION"
          if [ "$VERSION_TOML" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Cargo.toml says $VERSION_TOML but tag is $TAG_VERSION"
            exit 1
          fi

      - name: Build Homebrew source bundle
        id: bundle
        run: |
          TAG="${{ steps.get_version.outputs.VERSION }}"
          FILE="s6ui-${TAG}-homebrew.tar.gz"
          ./scripts/build-homebrew-source-bundle.sh --output "$FILE"
          SHA=$(shasum -a 256 "$FILE" | awk '{print $1}')
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILE}"
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.get_version.outputs.VERSION }}
          files: ${{ steps.bundle.outputs.file }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.VERSION }}"
          SHA="${{ steps.bundle.outputs.sha256 }}"
          URL="${{ steps.bundle.outputs.url }}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/allenai/homebrew-s6ui.git" homebrew-tap
          ./scripts/render-homebrew-formula.sh \
            --url "${URL}" \
            --sha256 "${SHA}" \
            --output homebrew-tap/Formula/s6ui.rb

          cd homebrew-tap

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/s6ui.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date"
            exit 0
          fi
          git commit -m "Update s6ui to ${TAG}"
          git push
